<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>습관 체크</title>
<style>
:root {
  --bg: #f5f6f8;
  --card: #ffffff;
  --text: #1f2933;
  --muted: #6b7280;
  --line: #d9dde3;
  --green: #2ea043;
  --gray: #e3e6ea;
  --danger: #c0392b;
  --radius: 10px;
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
}

main {
  max-width: 480px;
  margin: 0 auto;
  padding: 24px 16px 48px;
}

.top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}

h1 { margin: 0; font-size: 24px; }

.progress { margin: 0; font-size: 18px; font-weight: 600; }
.progress.all-done { color: var(--green); }

.today-label { margin: 2px 0 16px; color: var(--muted); font-size: 14px; }

.warning {
  margin: 0 0 12px;
  padding: 8px 12px;
  border: 1px solid var(--danger);
  border-radius: var(--radius);
  color: var(--danger);
  background: #fff;
  font-size: 14px;
}

.empty { margin: 0 0 16px; color: var(--muted); }

.habits { list-style: none; margin: 0 0 16px; padding: 0; }

.habit {
  margin-bottom: 8px;
  padding: 12px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}

.row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.info { flex: 1; min-width: 0; }
.info .name { display: block; overflow-wrap: anywhere; }
.info .streak { display: block; color: var(--muted); font-size: 13px; }

button {
  font: inherit;
  cursor: pointer;
}

button:focus-visible, input:focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 2px;
}

.check {
  flex: none;
  width: 40px;
  height: 40px;
  border: 2px solid var(--line);
  border-radius: 50%;
  background: var(--card);
  color: #fff;
  font-size: 20px;
  line-height: 1;
}

.check[aria-pressed="true"] {
  background: var(--green);
  border-color: var(--green);
}

.delete {
  flex: none;
  min-width: 40px;
  height: 40px;
  padding: 0 10px;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 14px;
}

.delete:hover { color: var(--danger); }

/* 지난 7일 칸: 왼쪽이 6일 전, 맨 오른쪽이 오늘 */
.week {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin-top: 10px;
}

.day {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 0;
  padding: 0;
  border: 0;
  background: none;
  color: var(--muted);
}

.day .box {
  display: block;
  width: 100%;
  height: 32px;
  border: 2px solid transparent;
  border-radius: 6px;
  background: var(--gray);
}

.day.done .box { background: var(--green); }
.day.today .box { border-color: var(--text); }
.day.today .dow { color: var(--text); font-weight: 600; }
.day .dow { font-size: 12px; line-height: 1.4; }

form { display: flex; gap: 8px; }

form input {
  flex: 1;
  min-width: 0;
  height: 44px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  font: inherit;
}

form button {
  flex: none;
  height: 44px;
  padding: 0 16px;
  border: 0;
  border-radius: var(--radius);
  background: var(--green);
  color: #fff;
}

form input:disabled, form button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.msg { min-height: 1.5em; margin: 8px 0 0; font-size: 14px; color: var(--danger); }
.limit { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>오늘의 습관</h1>
    <p id="progress" class="progress" aria-live="polite">0/0 완료</p>
  </header>
  <p id="today-label" class="today-label"></p>

  <p id="save-warning" class="warning" role="alert" hidden>저장하지 못했어요. 브라우저의 저장 공간 설정을 확인해 주세요.</p>

  <p id="empty" class="empty">아직 습관이 없어요. 아래에서 첫 습관을 추가해 보세요.</p>
  <ul id="habits" class="habits"></ul>

  <form id="add-form" autocomplete="off">
    <input id="name-input" type="text" maxlength="20" placeholder="새 습관 이름" aria-label="새 습관 이름">
    <button type="submit" id="add-button">추가</button>
  </form>
  <p id="form-msg" class="msg" role="status"></p>
  <p id="limit-msg" class="limit" hidden>습관은 최대 10개까지 추가할 수 있어요.</p>
</main>

<script>
'use strict';

const STORAGE_KEY = 'habit-tracker:v1';
const MAX_HABITS = 10;
const MAX_NAME = 20;
const DOW = ['일', '월', '화', '수', '목', '금', '토'];

const list = document.getElementById('habits');
const emptyMsg = document.getElementById('empty');
const form = document.getElementById('add-form');
const input = document.getElementById('name-input');
const addButton = document.getElementById('add-button');
const formMsg = document.getElementById('form-msg');
const limitMsg = document.getElementById('limit-msg');
const saveWarning = document.getElementById('save-warning');
const progress = document.getElementById('progress');
const todayLabel = document.getElementById('today-label');

// ---- 날짜 (로컬 시간대 기준 YYYY-MM-DD, toISOString 사용 안 함) ----

function pad(n) {
  return String(n).padStart(2, '0');
}

function dateKey(d) {
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

function todayKey() {
  return dateKey(new Date());
}

// base 기준 n일 전 (월말·서머타임 경계에서도 안전하도록 년·월·일로 만든다)
function daysAgo(base, n) {
  return new Date(base.getFullYear(), base.getMonth(), base.getDate() - n);
}

function labelKo(d) {
  return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + DOW[d.getDay()] + '요일';
}

// ---- 연속 기록: 오늘을 했으면 오늘부터, 아니면 어제부터 거꾸로 끊기기 전까지 ----

function streakOf(habit, base) {
  const done = new Set(habit.dates);
  let n = done.has(dateKey(base)) ? 0 : 1;
  let count = 0;
  while (done.has(dateKey(daysAgo(base, n)))) {
    count++;
    n++;
  }
  return count;
}

// ---- 저장 / 불러오기 ----

function load() {
  const empty = { version: 1, habits: [] };
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return empty;
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.habits)) return empty;

    const ids = new Set();
    const habits = [];
    for (const h of data.habits) {
      if (!h || typeof h.id !== 'string' || typeof h.name !== 'string' || !h.name.trim()) continue;
      if (ids.has(h.id)) continue;
      ids.add(h.id);
      const dates = Array.isArray(h.dates)
        ? [...new Set(h.dates.filter(d => typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d)))]
        : [];
      habits.push({ id: h.id, name: h.name, dates });
    }
    return { version: 1, habits };
  } catch (e) {
    return empty;
  }
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    saveWarning.hidden = true;
  } catch (e) {
    saveWarning.hidden = false;
  }
}

const state = load();

// ---- 그리기 (이름은 textContent로만 넣는다) ----

let renderedDay = '';

function render() {
  const base = new Date();
  const today = dateKey(base);
  renderedDay = today;

  list.textContent = '';
  todayLabel.textContent = labelKo(base);

  let doneCount = 0;

  for (const h of state.habits) {
    const marked = new Set(h.dates);
    const doneToday = marked.has(today);
    if (doneToday) doneCount++;

    const li = document.createElement('li');
    li.className = 'habit';
    li.dataset.id = h.id;

    // 윗줄: 오늘 체크 버튼 · 이름 · 연속 기록 · 삭제
    const row = document.createElement('div');
    row.className = 'row';

    const check = document.createElement('button');
    check.type = 'button';
    check.className = 'check';
    check.dataset.action = 'check';
    check.dataset.date = today;
    check.setAttribute('aria-pressed', String(doneToday));
    check.setAttribute('aria-label', h.name + ' 오늘 체크');
    check.textContent = doneToday ? '✓' : '';

    const info = document.createElement('div');
    info.className = 'info';

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = h.name;

    const streak = document.createElement('span');
    streak.className = 'streak';
    streak.textContent = streakOf(h, base) + '일 연속';

    info.append(name, streak);

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'delete';
    del.dataset.action = 'delete';
    del.setAttribute('aria-label', h.name + ' 삭제');
    del.textContent = '삭제';

    row.append(check, info, del);

    // 아랫줄: 지난 7일 칸 (왼쪽이 6일 전, 맨 오른쪽이 오늘)
    const week = document.createElement('div');
    week.className = 'week';
    week.setAttribute('role', 'group');
    week.setAttribute('aria-label', h.name + ' 지난 7일');

    for (let n = 6; n >= 0; n--) {
      const d = daysAgo(base, n);
      const key = dateKey(d);
      const on = marked.has(key);

      const day = document.createElement('button');
      day.type = 'button';
      day.className = 'day' + (on ? ' done' : '') + (n === 0 ? ' today' : '');
      day.dataset.action = 'day';
      day.dataset.date = key;
      day.setAttribute('aria-label', labelKo(d) + ', ' + (on ? '완료' : '미완료'));

      const box = document.createElement('span');
      box.className = 'box';

      const dow = document.createElement('span');
      dow.className = 'dow';
      dow.textContent = DOW[d.getDay()];

      day.append(box, dow);
      week.append(day);
    }

    li.append(row, week);
    list.append(li);
  }

  const total = state.habits.length;
  progress.textContent = doneCount + '/' + total + ' 완료';
  progress.classList.toggle('all-done', total > 0 && doneCount === total);

  emptyMsg.hidden = total > 0;

  const full = total >= MAX_HABITS;
  input.disabled = full;
  addButton.disabled = full;
  limitMsg.hidden = !full;
}

// ---- 조작 ----

function newId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function addHabit(rawName) {
  const name = rawName.trim();

  if (state.habits.length >= MAX_HABITS) return false;
  if (!name) {
    formMsg.textContent = '습관 이름을 입력해 주세요.';
    return false;
  }
  if (name.length > MAX_NAME) {
    formMsg.textContent = '습관 이름은 ' + MAX_NAME + '자까지 쓸 수 있어요.';
    return false;
  }
  const lower = name.toLowerCase();
  if (state.habits.some(h => h.name.trim().toLowerCase() === lower)) {
    formMsg.textContent = '이미 있는 습관이에요.';
    return false;
  }

  state.habits.push({ id: newId(), name, dates: [] });
  formMsg.textContent = '';
  save();
  render();
  return true;
}

function deleteHabit(id) {
  const habit = state.habits.find(h => h.id === id);
  if (!habit) return;
  if (!confirm("'" + habit.name + "' 습관과 모든 기록이 삭제됩니다. 삭제할까요?")) return;

  state.habits = state.habits.filter(h => h.id !== id);
  save();
  render();
}

// 오늘 체크 버튼과 7일 칸은 같은 데이터(dates)를 바꾼다.
// key는 버튼이 그려질 때 박아 둔 날짜라서, 사용자가 본 날짜 그대로 바뀐다.
function toggleDate(id, key, action) {
  const habit = state.habits.find(h => h.id === id);
  if (!habit) return;

  const i = habit.dates.indexOf(key);
  if (i === -1) habit.dates.push(key);
  else habit.dates.splice(i, 1);

  save();
  render();

  // 다시 그리면 버튼이 새로 만들어지므로 키보드 포커스를 되돌려 준다
  const target = action === 'check' ? '.check' : '.day[data-date="' + key + '"]';
  const btn = list.querySelector('[data-id="' + id + '"] ' + target);
  if (btn) btn.focus();
}

form.addEventListener('submit', e => {
  e.preventDefault();
  if (addHabit(input.value)) input.value = '';
  input.focus();
});

input.addEventListener('input', () => {
  formMsg.textContent = '';
});

list.addEventListener('click', e => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const id = btn.closest('li').dataset.id;
  const action = btn.dataset.action;
  if (action === 'delete') deleteHabit(id);
  else toggleDate(id, btn.dataset.date, action);
});

// ---- 자정 경과: 오늘 날짜가 바뀌었으면 전체를 다시 그린다 ----

function checkNewDay() {
  if (todayKey() !== renderedDay) render();
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') checkNewDay();
});
setInterval(checkNewDay, 60 * 1000);

render();
</script>
</body>
</html>
